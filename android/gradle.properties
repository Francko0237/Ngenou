org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# Kotlin intégré AGP désactivé : on utilise le plugin kotlin-android externe
android.builtInKotlin=false
# newDsl=false requis pour compatibilité avec les plugins pub.dev (audioplayers, etc.) qui utilisent l'ancien DSL
android.newDsl=false
