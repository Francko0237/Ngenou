<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ngenou — Votre Tuteur IA d'Apprentissage Intelligent</title>
  <meta name="description" content="Ngenou est une application mobile d'apprentissage intelligent : tuteur IA, défis quotidiens, extensions pédagogiques et suivi de révision. Cours et planning disponibles hors-ligne.">
  <meta name="theme-color" content="#060B1A">

  <!-- Open Graph -->
  <meta property="og:title" content="Ngenou — Votre Tuteur IA d'Apprentissage Intelligent">
  <meta property="og:description" content="Tuteur IA, défis quotidiens, extensions pédagogiques et planning de révision. Cours et planning disponibles hors-ligne.">
  <meta property="og:image" content="assets/images/logo_full.png">
  <meta property="og:type" content="website">

  <!-- Noindex automatique pour /admin -->
  <script>
    if (window.location.pathname.startsWith('/admin')) {
      var meta = document.createElement('meta');
      meta.name = 'robots';
      meta.content = 'noindex, nofollow';
      document.head.appendChild(meta);
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ngenou">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #060B1A;
      margin: 0;
      padding: 0;
      color: #F3EEE2;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #060B1A;
    }
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(60, 200, 232, 0.2);
      border-top-color: #3CC8E8;
      border-radius: 50%;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="loader-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
